# The same stages as `make ci`, on a Linux runner.
#
# This repository is public, so GitHub Actions minutes are free and there is no
# 10x macOS multiplier to avoid. The local `make ci` is still the gate that
# matters — the pre-push hook runs it, and it answers in seconds — this exists
# to catch the "works on my machine" class of failure.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # A real PostgreSQL, because that is what this project runs on everywhere.
    # The test suite does not need it — each suite gets its own in-process
    # PGlite — but `prisma migrate deploy` and the seed check do, and those are
    # precisely the two steps that prove a deployment will work.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradingsg
        ports:
          - 5432:5432
        # Without a health check the first step races the container's startup
        # and fails with a connection error that looks like a code problem.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/tradingsg"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Deliberately not `make ci`: the build stage is the slowest, and running
      # the cheap stages as separate steps means the Actions UI names which one
      # failed without anyone opening the log.
      - name: Format
        run: npm run fmt:check

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Repository invariants
        run: bash build/check-scripts.sh

      - name: Build
        run: npm run build

      - name: Seed runs cleanly
        run: npm run db:seed
