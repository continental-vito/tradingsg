# Drives the scheduled jobs by HTTP, as an alternative to Vercel Cron.
#
# Why this exists: Vercel's Hobby plan allows two cron jobs at daily
# granularity, and REFUSES THE DEPLOYMENT if vercel.json asks for more —
#
#   Error: Hobby accounts are limited to daily cron jobs. This cron expression
#   (*/15 8-22 * * 1-5) would run more than once per day.
#
# This app has nine jobs, three of them sub-daily. So vercel.json declares no
# crons at all and this drives them instead: Actions minutes are free on a
# public repository, the cron endpoints already authenticate with a bearer
# token, and it works on any plan.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      https://your-deployment.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value set in the Vercel project
#
# On Vercel Pro you could move these back into vercel.json, but there is little
# reason to: this already works, and build/check-schedule.py tests it.
name: Scheduled jobs

on:
  schedule:
    # Every 15 minutes. Individual jobs below decide whether they are due, so
    # one schedule can drive all of them without seven separate workflows.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Run a single job now"
        required: false
        type: choice
        options:
          - refresh-prices
          - close-prices
          - snapshot-valuations
          - snapshot-leaderboard
          - build-weekly-report
          - send-scheduled-reports
          - run-notifications
          - export-backup
          - housekeeping

concurrency:
  # A run that overlaps its predecessor would have two processes writing the
  # same valuations. The jobs are idempotent, so cancelling the older one is
  # safe and keeps the queue from backing up.
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out which jobs are due
        id: due
        env:
          MANUAL: ${{ inputs.job }}
        run: |
          if [ -n "${MANUAL}" ]; then
            echo "jobs=${MANUAL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The logic lives in build/due-jobs.sh so it can be tested —
          # build/check-schedule.py sweeps every quarter-hour of a week and
          # fails if any registered job is never due.
          jobs=$(bash build/due-jobs.sh "$(date -u +%H)" "$(date -u +%M)" "$(date -u +%u)" | tr '\n' ' ')
          echo "jobs=${jobs}" >> "$GITHUB_OUTPUT"

      - name: Call each due job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOBS: ${{ steps.due.outputs.jobs }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::APP_URL and CRON_SECRET must both be set as repository secrets."
            exit 1
          fi
          if [ -z "${JOBS}" ]; then
            echo "Nothing due this tick."
            exit 0
          fi

          failed=0
          for job in ${JOBS}; do
            echo "── ${job}"
            # The body is printed whatever the status: a job that half-ran says
            # so in its response, and swallowing that is how a silent failure
            # survives for a week.
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/${job}")
            cat /tmp/out.txt; echo
            if [ "${code}" != "200" ]; then
              # 404 is what the route returns for a bad or missing secret, so it
              # is the likeliest cause of a sudden across-the-board failure.
              echo "::error::${job} returned ${code} (404 usually means CRON_SECRET does not match)"
              failed=1
            fi
          done
          exit ${failed}
