# Runs a scheduled job by hand, over HTTP.
#
# The schedule itself lives in vercel.json: two daily Vercel Crons fire the
# chains in src/server/jobs/chains.ts, once after the market close and once in
# the morning. This workflow used to BE the scheduler, on a `*/15` cron — but
# GitHub treats schedules as best effort and fired it only every four to six
# hours, so the jobs that waited for a 15-minute evening window never ran and
# prices stopped updating without a single failed run.
#
# Kept for re-running something on demand: Actions → Scheduled jobs → Run
# workflow. Requires two repository secrets (Settings → Secrets and variables →
# Actions):
#   APP_URL      https://your-deployment.vercel.app
#   CRON_SECRET  the same value set in the Vercel project
name: Scheduled jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job (or chain of jobs) to run now"
        required: true
        type: choice
        options:
          - nightly
          - morning
          - refresh-prices
          - close-prices
          - snapshot-valuations
          - snapshot-leaderboard
          - build-weekly-report
          - run-notifications
          - export-backup
          - housekeeping
          - run-ai-investors

concurrency:
  # A run that overlaps its predecessor would have two processes writing the
  # same valuations. The jobs are idempotent, so cancelling the older one is
  # safe and keeps the queue from backing up.
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call the job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOBS: ${{ inputs.job }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::APP_URL and CRON_SECRET must both be set as repository secrets."
            exit 1
          fi

          # Normalised the same way src/lib/env.ts normalises APP_URL. A
          # trailing slash gives `…app//api/cron/<job>`, which Next answers
          # with a 308 to the single-slash form — so the job never ran and the
          # error blamed CRON_SECRET.
          APP_URL="$(printf '%s' "${APP_URL}" | tr -d '[:space:]' | sed -E 's#/+$##')"
          case "${APP_URL}" in
            http://*|https://*) ;;
            *) APP_URL="https://${APP_URL}" ;;
          esac
          if [ -z "${JOBS}" ]; then
            echo "Nothing due this tick."
            exit 0
          fi

          failed=0
          for job in ${JOBS}; do
            echo "── ${job}"
            # The body is printed whatever the status: a job that half-ran says
            # so in its response, and swallowing that is how a silent failure
            # survives for a week.
            # --location so a 308 is followed; curl preserves POST across 307
            # and 308, unlike 301/302 where it would silently become a GET.
            code=$(curl -sS --location --max-time 300 -o /tmp/out.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/${job}")
            cat /tmp/out.txt; echo
            if [ "${code}" != "200" ]; then
              case "${code}" in
                404) hint="the route 404s when CRON_SECRET is unset in Vercel or does not match this one";;
                3*)  hint="still redirecting after --location; check APP_URL points at the production domain";;
                5*)  hint="the job itself threw — the response body above is from the app";;
                *)   hint="unexpected";;
              esac
              echo "::error::${job} returned ${code} — ${hint}"
              failed=1
            fi
          done
          exit ${failed}
